
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e1e2d" />
    <meta name="description" content="Sistema de Gestión Administrativa Escolar">
    <link rel="apple-touch-icon" href="https://i.ibb.co/FbHJbvVT/images.png">
    
    <title>Sistema de Gestión Escolar</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/FbHJbvVT/images.png" />
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      // --- CONFIGURACIÓN DE API KEY ---
      // Puedes pegar tu clave aquí o dejar el placeholder y configurarla desde la app.
      const MY_API_KEY = 'PEGAR_AQUI_TU_API_KEY_DE_GOOGLE_STUDIO'; 

      window.process = { 
        env: { 
          API_KEY: MY_API_KEY 
        } 
      };

      // Configuración de Tailwind para Modo Oscuro
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              dark: {
                bg: '#1e1e2d',   // Fondo principal
                card: '#151521', // Fondo de tarjetas
                border: '#2d2d3b' // Bordes oscuros
              }
            }
          }
        }
      }
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",

    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "lucide-react": "https://esm.sh/lucide-react@0.263.1?external=react",
    "@google/genai": "https://esm.sh/@google/genai",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.5.28?external=jspdf",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "vite-plugin-pwa": "https://esm.sh/vite-plugin-pwa@^1.2.0"
  }
}
</script>

</head>

  <script type="module" src="/index.tsx"></script>
</body>
</html>
